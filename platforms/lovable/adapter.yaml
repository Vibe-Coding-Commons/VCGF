adapter_id: lovable
platform_name: Lovable
vendor: Lovable
adapter_version: 1.0.0
framework_compatibility: '>=1.0.0 <2.0.0'
status: stable
release_date: '2026-10-02'
last_verified: '2026-10-02'
maintainer: Eng. Hamada Sami
documentation:
- https://docs.lovable.dev/features/knowledge
- https://docs.lovable.dev/features/testing
- https://docs.lovable.dev/features/security
platform_surface: Lovable web application builder and project repository context
scope: Workspace Knowledge, Project Knowledge, repository instruction files, built-in
  verification tools, and security-review surfaces documented by Lovable.
supported_capabilities:
- Workspace Knowledge and Project Knowledge
- Repository instruction files including root AGENTS.md
- Browser testing, frontend tests, and edge-function verification
- Built-in security scans as supporting evidence
unsupported_capabilities:
- VCGF does not treat Lovable instructions or scans as a substitute for application-runtime
  authorization, validation, encryption, or operational controls.
known_limitations:
- Knowledge and instruction files shape agent behavior; they are not an application-runtime
  enforcement boundary.
- Platform security scans are evidence inputs, not proof of complete VCGF conformance.
control_mapping: control-mapping.yaml
verification_sources: verification/sources.yaml
verification_status: verified
