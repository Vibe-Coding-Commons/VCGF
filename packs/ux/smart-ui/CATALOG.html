</style></head><body><header><div class="wrap"><h1>VCGF Smart UI Catalog — v1.0.0</h1><div class="sub">كتالوج نهائي مرشح للدمج في VCGF 1.3.0. وجود المعيار هنا لا يعني تفعيله؛ الاختيار انتقائي من أربع طبقات مستقلة مع Reuse First.</div><div class="stats"><div class="stat"><b>36</b>Components</div><div class="stat"><b>24</b>Interactions</div><div class="stat"><b>20</b>Screen Compositions</div><div class="stat"><b>18</b>Journeys</div><div class="stat"><b>2</b>Bound Standards</div><div class="stat"><b>100</b>Total entries</div></div></div></header><div class="toolbar"><div class="toolbar-inner"><input id="q" type="search" placeholder="ابحث بالاسم أو الوظيفة أو الإشارة…" aria-label="بحث في الكتالوج"><select id="kind" aria-label="تصفية حسب النوع"><option value="">كل الأنواع</option><option value="component">المكونات</option><option value="interaction">أنماط التفاعل</option><option value="screen">Screen Composition</option><option value="modifier">Composition Modifiers</option><option value="journey">رحلات المستخدم</option><option value="bound">المعايير المرتبطة</option></select><select id="priority" aria-label="تصفية حسب الأولوية"><option value="">كل الأولويات</option><option>P0</option><option>P1</option><option>P2</option><option>BOUND</option></select><select id="category" aria-label="تصفية حسب التصنيف"><option value="">كل التصنيفات</option><option value="administration">administration</option><option value="approval">approval</option><option value="bulk">bulk</option><option value="bulk-operations">bulk-operations</option><option value="command-safety">command-safety</option><option value="component">component</option><option value="concurrency">concurrency</option><option value="connectivity">connectivity</option><option value="continuity">continuity</option><option value="data-transfer">data-transfer</option><option value="decision">decision</option><option value="decision-safety">decision-safety</option><option value="destructive-actions">destructive-actions</option><option value="discovery">discovery</option><option value="document-lifecycle">document-lifecycle</option><option value="draft-lifecycle">draft-lifecycle</option><option value="editing-safety">editing-safety</option><option value="external-binding">external-binding</option><option value="identity">identity</option><option value="identity-continuity">identity-continuity</option><option value="long-running">long-running</option><option value="navigation">navigation</option><option value="navigation-state">navigation-state</option><option value="offline">offline</option><option value="record-lifecycle">record-lifecycle</option><option value="scheduling">scheduling</option><option value="scope-continuity">scope-continuity</option><option value="screen-composition">screen-composition</option><option value="self-service">self-service</option><option value="system-states">system-states</option><option value="work-queue">work-queue</option></select></div></div><main><div id="grid" class="grid"></div><div id="empty">لا توجد نتائج مطابقة.</div></main><script>
const data=[{"id": "VCGF-UI-COMP-001", "title": "نظام التصميم والعناصر الأساسية", "name": "DesignSystemPrimitives", "priority": "P0", "category": "component", "kind": "component", "purpose": "توحيد لغة الواجهة وحالاتها دون فرض قالب واحد على جميع المنتجات. يصبح القرار البصري معرّفًا مركزيًا وقابلًا للاختبار، وتبقى المهمة الفعلية للمستخدم هي التي تحدد الكثافة والتخطيط.", "applies": "ينطبق عند إنشاء أو تعديل واجهات تفاعلية متكررة أو بناء أكثر من شاشة تتشارك عناصر أساسية. في مشروع قائم يبدأ بجرد المكوّنات الموجودة وإعادة استخدامها، لا باستبدالها تلقائيًا.", "notapp": "لا يفرض مكتبة CSS جديدة على خدمة API فقط، ولا يستبدل هوية معتمدة، ولا يحمّل تطبيقًا بسيطًا جميع عناصر مكتبة مؤسسية. السمات الإضافية لا تُعرض للمستخدم قبل اكتمالها.", "path": "standards/VCGF-UI-COMP-001-DesignSystemPrimitives.md", "signals": ["repeated_ui_primitives", "shared_design_language", "new_multi_screen_ui"], "decision": "required"}, {"id": "VCGF-UI-COMP-002", "title": "الجداول الذكية المتقدمة", "name": "SmartDataGrid", "priority": "P0", "category": "component", "kind": "component", "purpose": "تمكين المستخدم من فحص البيانات ومقارنتها واتخاذ إجراءات على نطاق معلوم، مع الحفاظ على دقة النتائج والأداء والصلاحيات عند نمو عدد السجلات.", "applies": "ينطبق على قوائم تشغيلية تحتاج فرزًا أو تصفية أو تخصيص أعمدة أو إجراءات على صفوف. يبدأ بجدول دلالي بسيط ثم يفعّل قدرات إضافية بحسب حجم البيانات والمهمة.", "notapp": "لا يستخدم بدل صفحات القراءة أو تدفقات الموافقة التي تحتاج سياقًا قصصيًا. لا تُضاف افتراضيًا خصائص تعديل خلايا أو تجميع أو تصدير لم يطلبها نطاق العمل.", "path": "standards/VCGF-UI-COMP-002-SmartDataGrid.md", "signals": ["tabular_operational_data", "sortable_table", "row_actions", "column_customization"], "decision": "required"}, {"id": "VCGF-UI-COMP-003", "title": "النماذج والتحقق الذكي الموحد", "name": "SmartFormFields", "priority": "P0", "category": "component", "kind": "component", "purpose": "تقليل أخطاء الإدخال وحفظ جهد المستخدم، مع فصل قواعد البيانات والأعمال عن تجميع الحقول وطريقة عرضها والتحقق المبكر داخل المتصفح.", "applies": "ينطبق على إنشاء السجلات وتعديلها والبحث المتقدم والنماذج المشروطة. يوسع النموذج القائم ولا ينقل المشروع إلى مكتبة جديدة لمجرد التشابه البصري.", "notapp": "لا يستبدل تحقق الخادم، ولا يطلب حقولًا لا يحتاجها الإجراء، ولا يتحول كل نموذج قصير إلى مولّد نماذج ديناميكي معقد.", "path": "standards/VCGF-UI-COMP-003-SmartFormFields.md", "signals": ["form_create_edit", "conditional_form", "advanced_search_form"], "decision": "required"}, {"id": "VCGF-UI-COMP-004", "title": "البحث والفلاتر المحفوظة", "name": "AdvancedFilterBuilder", "priority": "P0", "category": "component", "kind": "component", "purpose": "جعل نطاق النتائج مفهومًا وقابلًا للتكرار والمشاركة المصرح بها، بدل مجموعة فلاتر تخفي سبب ظهور البيانات أو تغيّر معنى الاستعلام بين الشاشات.", "applies": "ينطبق على قوائم تحتاج أكثر من معيار بحث أو طرق عرض متكررة. يدعم فلاتر بسيطة أولًا، ثم مجموعات AND وOR فقط عند الحاجة المؤكدة.", "notapp": "لا يضيف محرر شروط متداخلًا إلى بحث بسيط، ولا يسمح بكتابة SQL أو أسماء أعمدة حرة، ولا يضع استعلامات حساسة تلقائيًا في عنوان الصفحة.", "path": "standards/VCGF-UI-COMP-004-AdvancedFilterBuilder.md", "signals": ["multi_criteria_filter", "saved_filters", "advanced_filter_logic"], "decision": "recommended"}, {"id": "VCGF-UI-COMP-005", "title": "رفع الملفات وإدارة المرفقات", "name": "SmartFileUploader", "priority": "P0", "category": "component", "kind": "component", "purpose": "إنشاء دورة حياة واضحة للمرفق من الاختيار إلى الرفع والفحص والربط بالسجل، بحيث لا تختلط نسبة نقل الملف بسلامته أو اعتماده أو حفظ المعاملة المرتبطة به.", "applies": "ينطبق عند إرفاق وثائق أو صور أو ملفات إلى سجلات أو رسائل أو طلبات. يتوسع إلى الرفع المجزأ أو القابل للاستئناف عندما تبرر الأحجام والشبكات ذلك.", "notapp": "لا يضيف محول مستندات أو مضاد فيروسات وهميًا إلى الواجهة، ولا يتيح مصادر سحابية أو روابط خارجية ما لم تعتمدها سياسات المشروع وخدماته الفعلية.", "path": "standards/VCGF-UI-COMP-005-SmartFileUploader.md", "signals": ["file_upload", "attachments", "large_resumable_upload"], "decision": "required"}, {"id": "VCGF-UI-COMP-006", "title": "معاينة المستندات والملفات المحمية", "name": "DocumentPreviewer", "priority": "P0", "category": "component", "kind": "component", "purpose": "إتاحة قراءة الملف وفهمه داخل سياق العمل، مع الفصل بين صلاحية الوصول وقدرات واجهة العرض وحدود حماية النسخ التي لا تستطيع الواجهة ضمانها وحدها.", "applies": "ينطبق على الوثائق والصور وPDF المدعومة في النظام. تتطلب الصيغ المكتبية الأخرى خدمة تحويل معتمدة أو عارضًا مناسبًا مثبتًا، لا افتراض دعم تلقائي.", "notapp": "لا يُعد عارض PDF محرك تحرير أو توقيع أو تنقيح نهائي، ولا يعني إخفاء زر تنزيل منع استخراج البيانات من جهاز مصرح له بالعرض.", "path": "standards/VCGF-UI-COMP-006-DocumentPreviewer.md", "signals": ["document_preview", "pdf_preview", "protected_file_view"], "decision": "required"}, {"id": "VCGF-UI-COMP-007", "title": "النوافذ الحوارية والأدراج والقوائم العائمة", "name": "AdaptiveOverlay", "priority": "P0", "category": "component", "kind": "component", "purpose": "توفير طبقة تفاعل واضحة تستخدم Modal أو Drawer أو Popover وفق طول المهمة وخطورتها والمساحة، مع إدارة تركيز تمنع ضياع المستخدم أو احتجاز عمله.", "applies": "ينطبق على التأكيدات والعمليات المركزة والتفاصيل الجانبية والخيارات المؤقتة. يختار النوع حسب المهمة لا بمجرد أن التصميم يحتوي صندوقًا عائمًا.", "notapp": "لا توضع كل صفحة في نافذة، ولا تُكدس modals لإكمال سلسلة طويلة، ولا تُفرض مصيدة تركيز على Popover غير نمطي أو drawer غير modal دون مقتضى.", "path": "standards/VCGF-UI-COMP-007-AdaptiveOverlay.md", "signals": ["modal_dialog", "drawer", "popover", "focused_confirmation"], "decision": "recommended"}, {"id": "VCGF-UI-COMP-008", "title": "التنبيهات وحالات النظام والإشعارات", "name": "UnifiedFeedbackSystem", "priority": "P0", "category": "component", "kind": "component", "purpose": "إخبار المستخدم بدقة بما يجري وما نجح وما فشل وما يمكنه فعله، مع الفصل بين رسالة عابرة وحالة عملية وسجل إشعار دائم.", "applies": "ينطبق على جميع التفاعلات غير الفورية ونتائج الحفظ وحالات البيانات والإخفاقات. يضاف مركز إشعارات دائم فقط عندما يحتاج العمل الرجوع إلى أحداث محفوظة.", "notapp": "لا يحل Toast محل خطأ حقل أو سجل تدقيق، ولا تستخدم إشعارات متكررة بدل إصلاح خطأ جذري، ولا يدعي نجاح النظام إذا نجح العرض المحلي فقط.", "path": "standards/VCGF-UI-COMP-008-UnifiedFeedbackSystem.md", "signals": ["async_feedback", "save_result_feedback", "system_notifications", "empty_error_loading_states"], "decision": "required"}, {"id": "VCGF-UI-COMP-009", "title": "التنقل المتجاوب وهيكل التطبيق", "name": "AdaptiveNavigation", "priority": "P0", "category": "component", "kind": "component", "purpose": "إبقاء مكان المستخدم ومساره وخياراته مفهومة عبر الأجهزة والأدوار، مع الفصل بين قائمة التنقل وشجرة الصلاحيات والتوجيه الحقيقي للصفحات.", "applies": "ينطبق على تطبيق متعدد الصفحات أو الأقسام، ويختار sidebar أو top navigation أو service catalog حسب المهام وتكرارها وعمقها.", "notapp": "لا تفرض قائمة جانبية مؤسسية على موقع تسويقي بسيط، ولا تعتبر إخفاء الرابط حماية للمسار، ولا تحول كل تجميع قائمة إلى Treeview معقد.", "path": "standards/VCGF-UI-COMP-009-AdaptiveNavigation.md", "signals": ["multi_section_app_navigation", "deep_navigation", "responsive_app_shell"], "decision": "required"}, {"id": "VCGF-UI-COMP-010", "title": "الاختيار الهرمي والشجري", "name": "HierarchicalTreePicker", "priority": "P0", "category": "component", "kind": "component", "purpose": "تمثيل علاقات الأبناء والآباء بصورة مفهومة دون منح معنى إداري للاختيار لم يحدده نطاق العمل، مع الحفاظ على الأداء وصلاحيات الفروع.", "applies": "ينطبق على الإدارات والمجلدات والتصنيفات والهياكل التي تكون علاقتها الهرمية ضرورية للاختيار أو الاستكشاف.", "notapp": "لا يستبدل القائمة المسطحة إذا لم تكن علاقة الأب والابن مفيدة، ولا يفرض اختيار كل الأبناء عند اختيار الأب، ولا يعد التوسيع اختيارًا.", "path": "standards/VCGF-UI-COMP-010-HierarchicalTreePicker.md", "signals": ["hierarchical_selection", "tree_navigation", "folder_tree", "org_tree"], "decision": "required"}, {"id": "VCGF-UI-COMP-011", "title": "النماذج متعددة المراحل", "name": "SmartFormWizard", "priority": "P0", "category": "component", "kind": "component", "purpose": "تقسيم مهمة طويلة إلى مراحل ذات معنى مع مراجعة نهائية وحفظ تقدم، دون تحويل عدد الخطوات إلى عبء أو اعتبار اكتمال مرحلة موافقة نهائية على بياناتها.", "applies": "ينطبق عندما توجد مجموعات بيانات مترابطة أو مستندات أو مراجعة نهائية أو مسار مشروط يستفيد من التقسيم.", "notapp": "لا يستخدم لنموذج قصير لمجرد المظهر، ولا يجعل التقدم البصري مصدر حالة الأعمال، ولا يحفظ معاملات جزئية نهائية دون تعريف واضح.", "path": "standards/VCGF-UI-COMP-011-SmartFormWizard.md", "signals": ["multi_step_form", "wizard", "conditional_steps", "review_before_submit"], "decision": "required"}, {"id": "VCGF-UI-COMP-012", "title": "الإجراءات الحساسة والصلاحيات والتأكيد الآمن", "name": "PermissionAwareActions", "priority": "P0", "category": "component", "kind": "component", "purpose": "جعل الإجراءات المتاحة وأثرها واضحين للمستخدم، مع إبقاء التفويض والتحقق من الحالة والنسخة والتنفيذ في طبقة موثوقة خارج الواجهة.", "applies": "ينطبق على التعديل والحذف والتصدير والاعتماد والتفويض والإلغاء وأي إجراء يتغير بحسب المستخدم أو السجل أو حالته.", "notapp": "ليس نظام مصادقة أو إدارة مستخدمين كاملًا، ولا يجعل CASL أو إخفاء زر بديلًا عن تحقق الخادم، ولا يطالب بتأكيد ثقيل لكل إجراء بسيط قابل للتراجع.", "path": "standards/VCGF-UI-COMP-012-PermissionAwareActions.md", "signals": ["permission_sensitive_actions", "delete_action", "approval_action", "export_permission", "state_sensitive_actions"], "decision": "required"}, {"id": "VCGF-UI-COMP-013", "title": "المحرر النصي الغني والمحتوى المنظم", "name": "RichTextEditor", "priority": "P1", "category": "component", "kind": "component", "purpose": "تحرير محتوى غني يحتاج بنية وتنسيقًا دون تحويل الحقل إلى مدخل HTML غير موثوق أو ربط محتوى المؤسسة نهائيًا بمحرك تحرير واحد.", "applies": "ينطبق على المراسلات والملاحظات الطويلة والقوالب والمحتوى الذي يحتاج عناوين أو جداول أو روابط. يختار مجموعة أدوات صغيرة تناسب نوع المستند.", "notapp": "لا يستخدم بدل input قصير أو textarea كافية، ولا يعد محررًا مكتبيًا كاملًا أو نظام تعاون وتوقيع وتتبع تغييرات بمجرد تثبيت حزمة تحرير.", "path": "standards/VCGF-UI-COMP-013-RichTextEditor.md", "signals": ["rich_text", "document_template_editing", "long_structured_content"], "decision": "required"}, {"id": "VCGF-UI-COMP-014", "title": "البحث الشامل ولوحة الأوامر السريعة", "name": "GlobalSearchCommandPalette", "priority": "P1", "category": "component", "kind": "component", "purpose": "تقليل زمن الوصول إلى صفحة أو سجل أو أمر، دون خلط نتائج المعلومات بالأفعال أو فتح مسار جديد لتسريب البيانات عبر الاقتراحات والعدادات.", "applies": "ينطبق على تطبيق متعدد الوحدات أو المستخدمين المتكررين الذين يستفيدون من اختصار الوصول. يمكن اعتماد بحث شامل بلا أوامر إذا كان التنفيذ السريع غير مطلوب.", "notapp": "ليس محرك بحث دلالي أو فهرسة كاملًا بمجرد تركيب Command؛ ولا يسمح بتجاوز التأكيد والصلاحيات عند عرض أوامر حساسة.", "path": "standards/VCGF-UI-COMP-014-GlobalSearchCommandPalette.md", "signals": ["global_search", "command_palette", "cross_module_navigation"], "decision": "recommended"}, {"id": "VCGF-UI-COMP-015", "title": "الاعتمادات وسير العمل والخط الزمني", "name": "WorkflowApprovalTimeline", "priority": "P1", "category": "component", "kind": "component", "purpose": "توضيح الحالة الحالية والمسؤول والإجراءات الممكنة والأحداث السابقة، مع إبقاء محرك التنفيذ والحالات والاعتمادات مرجعًا في الخادم وليس الرسم أو المتصفح.", "applies": "ينطبق على طلبات تمر بحالات واعتمادات أو تفويض ومهل محددة. يستخدم عرضًا خطيًا بسيطًا إن كان كافيًا، ومحررًا رسوميًا فقط عندما يحتاج المستخدم إلى تعريف التدفقات.", "notapp": "لا يعد XState أو React Flow محرك عمليات مؤسسيًا دائمًا وموزعًا تلقائيًا، ولا يعني رسم مخطط وجود مهام ومؤقتات وتنفيذ موثوق على الخادم.", "path": "standards/VCGF-UI-COMP-015-WorkflowApprovalTimeline.md", "signals": ["workflow_approval", "approval_timeline", "delegation", "sla_workflow"], "decision": "required"}, {"id": "VCGF-UI-COMP-016", "title": "سجل العمليات ومقارنة الإصدارات", "name": "AuditHistoryViewer", "priority": "P1", "category": "component", "kind": "component", "purpose": "عرض دليل مفهوم على من غيّر ماذا ومتى وبأي نتيجة، دون الخلط بين شاشة تاريخ جميلة وبين سجل يمكن الاعتماد عليه أو ادعاء عدم قابلية التلاعب بلا آلية إثبات.", "applies": "ينطبق على السجلات المهمة والتغييرات الإدارية والاعتمادات والوثائق والإعدادات، مع درجة تفصيل تتناسب مع المخاطر ومتطلبات الاحتفاظ المعتمدة.", "notapp": "ليس سجل console أو analytics، ولا يخزن كلمات مرور أو رموز تحقق، ولا يتيح استعادة نسخة قديمة بمجرد عرض الفرق دون خدمة تفويض وتنفيذ.", "path": "standards/VCGF-UI-COMP-016-AuditHistoryViewer.md", "signals": ["audit_history", "version_history", "change_diff", "administrative_change_log"], "decision": "required"}, {"id": "VCGF-UI-COMP-017", "title": "إدخال الأرقام والمبالغ والنسب والكميات", "name": "SmartNumericInput", "priority": "P1", "category": "component", "kind": "component", "purpose": "الفصل بين القيمة العددية الدقيقة وتنسيقها المحلي ووحدتها وقواعد حسابها، مع تجربة إدخال تسمح بالتصحيح دون قفز المؤشر أو تقريب مالي خفي.", "applies": "ينطبق على المبالغ والكميات والنسب والأوزان والقياسات. لكل نوع عقد وحدات ودقة وحدود وقواعد تقريب حسب المجال وليس الإعداد الجمالي وحده.", "notapp": "لا يفترض أن جميع العملات منزلتان عشريتان، ولا يستخدم float عاديًا كضمان دقة محاسبية، ولا يحول معرفًا طويلًا أو رقم هاتف إلى حقل عدد.", "path": "standards/VCGF-UI-COMP-017-SmartNumericInput.md", "signals": ["numeric_money_quantity", "percentage_input", "measurement_input", "accounting_amount"], "decision": "required"}, {"id": "VCGF-UI-COMP-018", "title": "الهاتف والبريد ورموز التحقق", "name": "SmartContactFields", "priority": "P1", "category": "component", "kind": "component", "purpose": "جمع وسيلة اتصال صحيحة ومفهومة مع فصل صحة الصيغة عن التحقق من القدرة على الوصول إليها، وحماية مسار الرموز من التكرار والتسريب وإساءة الاستخدام.", "applies": "ينطبق على حقول الهاتف والبريد، ويضاف OTP فقط عند حاجة موثقة للتحقق أو المصادقة وبربط خدمة موثوقة.", "notapp": "لا يثبت رقم هاتف صحيح التنسيق هوية قانونية أو ملكية دائمة، ولا يضيف OTP تلقائيًا لكل نموذج، ولا يعتبر SMS وحده مناسبًا لكل عملية عالية المخاطر.", "path": "standards/VCGF-UI-COMP-018-SmartContactFields.md", "signals": ["phone_input", "email_input", "otp_verification", "contact_fields"], "decision": "required"}, {"id": "VCGF-UI-COMP-019", "title": "استيراد وتصدير البيانات مع المعاينة والتحقق", "name": "DataImportExportWizard", "priority": "P1", "category": "component", "kind": "component", "purpose": "نقل البيانات من وإلى النظام ضمن نطاق مفوض ومفهوم، مع اكتشاف الأخطاء قبل الأثر وتوثيق السجلات المتأثرة والنتائج الجزئية ومنع تكرار العملية.", "applies": "ينطبق على استيراد CSV أو XLSX أو تصدير مجموعات تشغيلية، ويتوسع إلى مهام خادمية مجزأة عندما يزيد الحجم أو الأثر.", "notapp": "ليس فتح ملف جدول إذنًا بتنفيذ صيغه أو وحداته البرمجية، ولا يستورد البيانات إلى الإنتاج بمجرد نجاح التحليل في المتصفح، ولا يفرض استيرادًا جزئيًا بلا موافقة سياسة.", "path": "standards/VCGF-UI-COMP-019-DataImportExportWizard.md", "signals": ["data_import", "data_export", "csv_xlsx_import", "bulk_export"], "decision": "required"}, {"id": "VCGF-UI-COMP-020", "title": "لوحات المعلومات والمؤشرات والرسوم", "name": "SmartDashboardWidgets", "priority": "P1", "category": "component", "kind": "component", "purpose": "عرض مؤشرات قابلة للتفسير والتتبع إلى بياناتها، لا أرقام جذابة بلا تعريف أو سياق، مع مراعاة حداثة المعلومات ونطاق الصلاحيات والاختلاف بين الصفر وعدم توفر البيانات.", "applies": "ينطبق على صفحات متابعة تدعم قرارات تشغيلية أو تحليلية محددة. تختار المؤشرات والرسوم حسب السؤال والمستخدم لا لأن القالب يوفرها.", "notapp": "لا تضيف رسومًا وهمية أو مؤشرات تجريبية إلى بيئة إنتاج، ولا تعتبر مكتبة الرسوم محرك حساب أو دليلاً على صحة KPI، ولا تستنتج علاقة سببية من رسم ارتباط.", "path": "standards/VCGF-UI-COMP-020-SmartDashboardWidgets.md", "signals": ["dashboard_kpi", "operational_metrics", "analytical_charts"], "decision": "required"}, {"id": "VCGF-UI-COMP-021", "title": "لوحات كانبان والسحب والإفلات المنضبط", "name": "SmartKanbanBoard", "priority": "P2", "category": "component", "kind": "component", "purpose": "تمثيل العمل بحسب الحالات أو الأعمدة مع نقل وترتيب يمكن فهم أثرهما والتراجع عن تمثيلهما عند الرفض، دون تحويل حركة بطاقة إلى قرار أعمال غير مفوض.", "applies": "ينطبق على مهام أو فرص أو حالات عمل يستفيد المستخدم من رؤيتها موزعة على أعمدة. يضاف السحب عندما لا يضر بالوصولية أو دقة التنفيذ.", "notapp": "لا يعد نقل بطاقة اعتمادًا أو إنجازًا بحد ذاته، ولا يفرض كانبان على بيانات تحتاج مقارنة أعمدة رقمية دقيقة، ولا يستخدم السحب كوسيلة وحيدة للإجراء.", "path": "standards/VCGF-UI-COMP-021-SmartKanbanBoard.md", "signals": ["kanban", "drag_state_board", "pipeline_board"], "decision": "required"}, {"id": "VCGF-UI-COMP-022", "title": "المواعيد والموارد والجداول الزمنية", "name": "UnifiedScheduler", "priority": "P2", "category": "component", "kind": "component", "purpose": "تمثيل مواعيد وحجوزات تشير إلى وقت ومعنى متفق عليهما عبر المناطق والتقاويم، مع منع التعارض في الخادم وعدم الخلط بين تفضيل عرض التاريخ وقواعد التكرار.", "applies": "ينطبق على الاجتماعات والحجوزات والورديات والموارد عندما يحتاج المشروع عرضًا يوميًا أو أسبوعيًا أو شهريًا أو قائمة مواعيد.", "notapp": "لا يفترض دعم أم القرى أو التكرار الهجري في مكتبة جدولة لمجرد دعم locale عربية، ولا يجعل اختيار وقت متاح في الشاشة ضمانًا لحجزه.", "path": "standards/VCGF-UI-COMP-022-UnifiedScheduler.md", "signals": ["scheduler", "appointments", "resource_booking", "shift_calendar", "meeting_calendar"], "decision": "required"}, {"id": "VCGF-UI-COMP-023", "title": "الحفظ التلقائي والمسودات والتغييرات غير المحفوظة", "name": "DraftAutosaveManager", "priority": "P2", "category": "component", "kind": "component", "purpose": "حماية وقت المستخدم من انقطاع الاتصال أو الانتقال العرضي، مع تعريف صريح لما حُفظ وأين وبأي إصدار، ومنع الكتابة فوق عمل مستخدم آخر أو تخزين أسرار على الجهاز.", "applies": "ينطبق على النماذج الطويلة والمحررات والطلبات متعددة المراحل عندما يبرر احتمال فقد العمل وجود مسودات. يظل الحفظ اليدوي كافيًا للمهام الصغيرة حسب التقييم.", "notapp": "لا يدّعي الحفظ بمجرد وضع البيانات في ذاكرة أو localStorage، ولا يعد draft موافقة أو إرسالًا نهائيًا، ولا يضمن استمرار beforeunload أو الاتصال عند إغلاق المتصفح.", "path": "standards/VCGF-UI-COMP-023-DraftAutosaveManager.md", "signals": ["long_form_autosave", "drafts", "unsaved_work_protection", "long_editor"], "decision": "recommended"}, {"id": "VCGF-UI-COMP-024", "title": "التبويبات والأقسام القابلة للطي واللوحات المقسمة", "name": "AdaptiveContentPanels", "priority": "P2", "category": "component", "kind": "component", "purpose": "تنظيم المعلومات المتوازية أو التفصيلية مع الحفاظ على حالة المستخدم وإمكانية الوصول، دون استخدام التبويبات لإخفاء بنية شاشة غير مفهومة أو أخطاء يجب علاجها.", "applies": "ينطبق على أقسام متوازية مثل البيانات والمرفقات والسجل، أو تفاصيل يمكن كشفها تدريجيًا، أو عرض قائمة وتفاصيل بجوار بعضهما.", "notapp": "لا يستخدم tabs لتدفق يجب إكماله بالتتابع، ولا accordion لإخفاء تحذير حرج، ولا split view عندما يجعل كلا الجزأين غير مقروءين.", "path": "standards/VCGF-UI-COMP-024-AdaptiveContentPanels.md", "signals": ["tabs", "accordion", "split_view", "master_detail_panels"], "decision": "recommended"}, {"id": "VCGF-UI-COMP-025", "title": "عرض السجل والتفاصيل الذكي", "name": "SmartRecordDetailView", "priority": "P0", "category": "component", "kind": "component", "purpose": "عرض سجل واحد بصورة قابلة للفهم واتخاذ القرار، مع فصل القراءة عن التحرير وإظهار الحالة والمصدر والعلاقات والإجراءات المسموح بها دون تحويل كل صفحة تفاصيل إلى نموذج تحرير.", "applies": "ينطبق على صفحات تفاصيل العملاء والطلبات والمعاملات والموظفين والأصول والمستندات وأي كيان يحتاج عرضًا غنيًا ومنظمًا قبل اتخاذ إجراء.", "notapp": "لا يُستخدم بدل نموذج التحرير عند المهمة الأساسية هي الإدخال، ولا بدل جدول المقارنة عند الحاجة إلى فحص عدة سجلات جنبًا إلى جنب، ولا يكرر معلومات لا تضيف قرارًا.", "path": "standards/VCGF-UI-COMP-025-SmartRecordDetailView.md", "signals": ["record_detail", "entity_profile", "read_only_summary", "master_detail_record"], "decision": "required"}, {"id": "VCGF-UI-COMP-026", "title": "القوائم والبطاقات الذكية المتجاوبة", "name": "SmartCollectionList", "priority": "P0", "category": "component", "kind": "component", "purpose": "عرض مجموعات سجلات عندما تكون القراءة السريعة والسياق البصري أهم من المقارنة العمودية الصارمة، مع تبديل مسؤول بين قائمة وبطاقات دون تكرار منطق البيانات.", "applies": "ينطبق على أدلة الأشخاص والملفات والمشاريع والطلبات والنتائج التي تحتاج ملخصًا لكل عنصر، خصوصًا على الجوال أو عندما لا تناسبها الجداول.", "notapp": "لا يستبدل SmartDataGrid عندما تكون المقارنة عبر أعمدة والفرز الكثيف والتحديد واسع النطاق هي المهمة الأساسية.", "path": "standards/VCGF-UI-COMP-026-SmartCollectionList.md", "signals": ["collection_list", "card_list", "responsive_record_list", "search_results_list"], "decision": "required"}, {"id": "VCGF-UI-COMP-027", "title": "الخط الزمني للنشاط والأحداث", "name": "SmartActivityTimeline", "priority": "P1", "category": "component", "kind": "component", "purpose": "عرض تسلسل أحداث العمل للمستخدم بلغة مفهومة، مع الفصل بين النشاط التشغيلي والعرض القانوني لسجل التدقيق، وربط كل حدث بمرجعه وزمنه ومصدره.", "applies": "ينطبق على صفحات السجلات التي تحتاج تاريخ نشاط مفهوم للمستخدم مثل إنشاء وتعديل وتعليق وإرسال واستلام وتغيير حالة.", "notapp": "لا يستبدل AuditHistoryViewer كسجل تدقيق موثوق ولا WorkflowApprovalTimeline عندما تكون مراحل الموافقة هي البنية الرئيسية.", "path": "standards/VCGF-UI-COMP-027-SmartActivityTimeline.md", "signals": ["activity_timeline", "record_activity", "event_feed", "business_event_history"], "decision": "recommended"}, {"id": "VCGF-UI-COMP-028", "title": "التعليقات والمحادثات والـMentions", "name": "SmartCollaborationThread", "priority": "P1", "category": "component", "kind": "component", "purpose": "توفير نقاش مرتبط بالسجل مع ردود وإشارات ومرفقات وصلاحيات واضحة، دون تحويل التعليقات إلى قناة غير خاضعة للحوكمة أو بديل عن قرارات سير العمل.", "applies": "ينطبق على السجلات التي تحتاج تعاونًا سياقيًا بين المستخدمين مثل المعاملات والمشاريع والمهام والوثائق.", "notapp": "لا يستخدم للمحادثات العامة غير المرتبطة بسياق، ولا كبديل لرسائل النظام الرسمية أو مسار اعتماد ملزم.", "path": "standards/VCGF-UI-COMP-028-SmartCollaborationThread.md", "signals": ["comments_thread", "collaboration", "mentions", "record_discussion"], "decision": "required"}, {"id": "VCGF-UI-COMP-029", "title": "مركز الإشعارات الذكي", "name": "SmartNotificationCenter", "priority": "P1", "category": "component", "kind": "component", "purpose": "تجميع الإشعارات المستمرة التي تحتاج رجوعًا أو إجراءً، مع فصلها عن رسائل toast اللحظية وإدارة القراءة والأولوية والروابط والصلاحيات بطريقة متسقة.", "applies": "ينطبق عندما يحتاج النظام Inbox للإشعارات أو مهام تنتظر المستخدم أو أحداث ذات رابط يمكن الرجوع إليه.", "notapp": "لا يحول كل نجاح حفظ إلى إشعار دائم، ولا يُستخدم كقناة وحيدة للأحداث الحرجة التي تتطلب تسليمًا خارجيًا أو التزامًا تنظيميًا.", "path": "standards/VCGF-UI-COMP-029-SmartNotificationCenter.md", "signals": ["notification_center", "notification_inbox", "persistent_notifications", "task_inbox"], "decision": "required"}, {"id": "VCGF-UI-COMP-030", "title": "العروض المحفوظة وتفضيلات العرض", "name": "SmartSavedViewsManager", "priority": "P1", "category": "component", "kind": "component", "purpose": "حفظ مجموعات موثقة من الفلاتر والفرز والأعمدة وطريقة العرض ضمن نطاق مستخدم أو فريق، مع إصدار للمخطط يمنع كسر العروض عند تغير الحقول.", "applies": "ينطبق على الجداول والقوائم ولوحات المتابعة والبحث المتقدم عندما يكرر المستخدم نفس منظور البيانات.", "notapp": "لا يُستخدم لحفظ أسرار أو نتائج بيانات كاملة، ولا يجعل تفضيل المستخدم يتجاوز فلترًا أمنيًا أو نطاق منشأة.", "path": "standards/VCGF-UI-COMP-030-SmartSavedViewsManager.md", "signals": ["saved_views", "saved_filters", "column_presets", "user_view_preferences"], "decision": "recommended"}, {"id": "VCGF-UI-COMP-031", "title": "شريط الإجراءات السياقي والجماعي", "name": "SmartContextualActionBar", "priority": "P0", "category": "component", "kind": "component", "purpose": "تجميع الإجراءات الأساسية والثانوية حسب سياق السجل أو التحديد، مع ترتيب قائم على التكرار والمخاطر والصلاحية وحالة العمل بدل تشتيت الأزرار في الشاشة.", "applies": "ينطبق على صفحات التفاصيل والقوائم والجداول عندما توجد عدة إجراءات أو عمليات جماعية تتغير حسب الحالة أو التحديد.", "notapp": "لا يُنشئ toolbar لمجرد وجود زر أو زرين واضحين، ولا يخفي الإجراءات الحرجة داخل قائمة غامضة إذا كانت المهمة تتطلب ظهورها.", "path": "standards/VCGF-UI-COMP-031-SmartContextualActionBar.md", "signals": ["contextual_actions", "bulk_actions", "action_toolbar", "selection_actions"], "decision": "required"}, {"id": "VCGF-UI-COMP-032", "title": "اختيار وربط الكيانات والعلاقات", "name": "SmartRelationshipPicker", "priority": "P1", "category": "component", "kind": "component", "purpose": "اختيار كيان أو أكثر وربطه بسجل مع إظهار السياق الذي يميز الكيانات المتشابهة، ودعم البحث البعيد والقيم المحفوظة والعلاقات متعددة الأنواع دون إساءة استخدام قائمة بسيطة.", "applies": "ينطبق على ربط عميل بمشروع أو موظف بمعاملة أو أصل بعقد أو أي علاقة تحتاج أكثر من label/value بسيط.", "notapp": "لا يستخدم إذا كانت القائمة قصيرة وثابتة أو ثنائية؛ في تلك الحالات يكفي المكوّن الأبسط. البحث الداخلي يتبع Searchable Select.", "path": "standards/VCGF-UI-COMP-032-SmartRelationshipPicker.md", "signals": ["relationship_picker", "entity_linking", "cross_entity_picker", "related_record_select"], "decision": "required"}, {"id": "VCGF-UI-COMP-033", "title": "العناوين والمواقع الجغرافية الذكية", "name": "SmartAddressLocationFields", "priority": "P1", "category": "component", "kind": "component", "purpose": "إدخال العناوين والمواقع بصورة قابلة للتعريب والتحقق والتدرج بين الدولة والمنطقة والمدينة والرمز والموقع، دون فرض نموذج عنوان واحد على كل دولة.", "applies": "ينطبق على بيانات العملاء والمنشآت والفروع والشحن والأصول والمواقع الميدانية التي تحتاج عنوانًا منظمًا أو إحداثيات.", "notapp": "لا يفرض خريطة أو GPS عندما يكفي نص عنوان، ولا يخزن عنوانًا مركبًا واحدًا إذا كانت قواعد العمل تحتاج حقوله منفصلة.", "path": "standards/VCGF-UI-COMP-033-SmartAddressLocationFields.md", "signals": ["address_fields", "location_fields", "country_city_address", "geographic_location"], "decision": "required"}, {"id": "VCGF-UI-COMP-034", "title
