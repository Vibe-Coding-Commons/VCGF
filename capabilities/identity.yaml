  condition:
    fact: auth-model
    operator: equals
    value: local-password
  reason: Local passwords need recovery; SSO delegates recovery to identity provider
required_evidence:
- positive and negative tests scoped to capability
- implementation and environment reference
exception_policy: Explicit owner-approved, expiring exception; no automatic compliance
