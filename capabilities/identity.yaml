contract_version: 1.1.0
capability_id: identity
description: Master sections [16]; task-specific requirements, not standalone product
  certification
owner: Eng. Hamada Sami
applies_to:
- application
applicability:
  conditions: []
  unknown_policy: block_or_request_fact
control_ids:
- VCGF-IAM-001
- VCGF-IAM-002
- VCGF-IAM-004
- VCGF-IAM-007
dependencies:
- relation: requires
  targets:
  - sessions
  reason: identity requires evaluation of sessions
- relation: requires
  targets:
  - fields
  reason: identity requires evaluation of fields
- relation: requires
  targets:
  - ux-accessibility
  reason: identity requires evaluation of ux-accessibility
- relation: requires
  targets:
  - audit
  reason: identity requires evaluation of audit
- relation: requires_when
  targets:
