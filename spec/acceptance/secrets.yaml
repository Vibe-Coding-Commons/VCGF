# Acceptance tests for the secrets controls; see spec/acceptance/README.md for the format and rules.
acceptance_version: 1.0.0
domain: secrets
controls:
  VCGF-SECR-001:
    requirement_sources: [S26]
    tests:
      - id: VCGF-SECR-001-AT01
        type: automated
        criterion: >-
          A commit that introduces a canary secret (a cloud access key pattern, a private key block, a database
          connection string with a password, an OAuth client secret) in any file, including documentation and
          example configuration, is rejected by the pre-commit or pre-receive hook and by the pull request
          pipeline; a scan of the complete repository history reports zero unresolved findings; and a historical
          finding counts as resolved only when a rotation of that secret is recorded, never because the value was
          removed from the latest commit.
        method: >-
          The secret scanner runs on every push and on the full history in the pipeline; a test commit with each
          canary pattern is pushed to a scratch branch and the hook and pipeline rejection is recorded; a reviewer
          checks each resolved historical finding against the rotation record.
        negative_path: true
        evidence: [security-scan, test-result]
        automation:
          kind: hook
          reference: pre-commit secret-scan hook and ci/secret-scan (per project)
      - id: VCGF-SECR-001-AT02
        type: automated
        criterion: >-
          The production build output (JavaScript bundles, source maps, HTML, mobile or desktop binaries) contains
          no value from the server-side secrets inventory and no secret-pattern match, a build that references a
          non-public environment variable from client code fails, and no token classified as a secret is written
          to browser localStorage or sessionStorage.
        method: >-
          A post-build step scans every emitted artifact for the inventory values and the pattern set, a build is
          attempted with a server-only variable referenced in client code, and an end-to-end test inspects web
          storage after login.
        negative_path: true
        evidence: [security-scan, test-result]
        automation:
          kind: ci
          reference: ci/scan-client-bundle (per project)
      - id: VCGF-SECR-001-AT03
        type: automated
        criterion: >-
          No configured secret value appears in application, access or error logs, crash reports or error
          responses, including under a forced startup failure and an unhandled exception that dumps configuration;
          an API key or token presented to the application in a URL query string is refused and logged only in
          redacted form; and no outbound request the application builds carries a secret in its URL path or query,
          the secret traveling only in a header or body.
        method: >-
          An integration test injects marker secrets into the configuration, triggers the failure paths, scans all
          captured log streams and responses for the markers, sends a request with the key in the query string
          asserting the refusal and the redacted access log line, and captures outbound requests through a proxy
          to assert that no URL contains a marker.
        negative_path: true
        evidence: [test-result, log-sample]
        automation:
          kind: ci
          reference: tests/secrets/test_secret_exposure_paths (per project)
      - id: VCGF-SECR-001-AT04
        type: review
        criterion: >-
          Every secret in the inventory (API keys, database credentials, platform keys, encryption and signing
          keys, webhook secrets, OAuth client secrets, SMTP credentials, private certificates) is held in the
          platform secret manager or vault, has a distinct value per environment and per service, is scoped to the
          minimum permissions its service uses, and records an owner, its usage, an expiry or rotation date and an
          emergency revocation path.
        method: >-
          A reviewer compares the secrets inventory with the secret manager listing and the permission policies,
          confirming per-environment and per-service separation and the four recorded attributes for each entry.
        negative_path: false
        evidence: [inventory, configuration-record]
        automation:
          kind: none
      - id: VCGF-SECR-001-AT05
        type: automated
        criterion: >-
          A development or staging workload identity and a developer account that attempt to read a production
          secret from the secret manager are denied, the denial appears in the audit log, and the production
          workload identity can read only the secrets assigned to its own service.
        method: >-
          A test executed with each non-production identity requests the production secret paths and asserts the
          access-denied result and the audit entry, then lists what the production identity can read and compares
          it with the service assignment.
        negative_path: true
        evidence: [test-result, log-sample]
        automation:
          kind: ci
          reference: tests/secrets/test_environment_isolation (per project)
      - id: VCGF-SECR-001-AT06
        type: automated
        criterion: >-
          The built container image layers, the deployment manifests, the infrastructure definitions and the CI
          pipeline definition contain no plaintext value from the secrets inventory and no secret-pattern match,
          and every secret the workload consumes arrives through the secret manager or an injected secret
          reference rather than a committed configuration file or a public environment variable.
        method: >-
          A pipeline step scans the image layers, manifests, infrastructure files and pipeline definition for the
          inventory values and the pattern set, and a reviewer traces each secret the workload reads to its
          injection point in the deployment configuration.
        negative_path: false
        evidence: [security-scan, configuration-record]
        automation:
          kind: ci
          reference: ci/scan-deployment-config (per project)
  VCGF-SECR-002:
    tests:
      - id: VCGF-SECR-002-AT01
        type: review
        criterion: >-
          Each secret class in the inventory (API keys, database credentials, encryption and signing keys, webhook
          secrets, OAuth client secrets, SMTP credentials, private certificates) has a written procedure that
          states the maximum rotation interval, the owner, the ordered rotation steps, the dependent systems to
          update, and an emergency revocation path with a target time, and the recorded last rotation date of every
          secret is within its interval or covered by an approved, time-bounded exception.
        method: >-
          A reviewer reads the rotation runbook against the inventory, confirms each element for each class, and
          compares the last rotation dates in the secret manager with the stated intervals and the exception
          register.
        negative_path: false
        evidence: [configuration-record, inventory]
        automation:
          kind: none
      - id: VCGF-SECR-002-AT02
        type: automated
        criterion: >-
          Executing the documented rotation procedure for a database credential, an API key, a signing key and a
          TLS or client certificate in a non-production environment keeps every dependent request succeeding
          during the overlap period, and after the old value is revoked a request authenticated with the old
          credential, a token signed with the old key, a connection presenting the old certificate and a webhook
          signed with the old secret are each rejected.
        method: >-
          A pipeline job runs the rotation steps while a probe sends continuous requests, records any failure during
          the rotation, then replays requests with the retired credential, token, certificate and signature and
          asserts the rejection.
        negative_path: true
        evidence: [test-result, log-sample]
        automation:
          kind: ci
          reference: tests/secrets/test_rotation_procedure (per project)
      - id: VCGF-SECR-002-AT03
        type: manual
        criterion: >-
          A compromise drill that treats a secret as exposed (for example committed to a public repository and then
          removed from the latest commit) completes the revocation of the secret and the deployment of its
          replacement within the target time stated in the procedure, reviews the access logs of the exposure
          window and of each dependent system that accepted the secret for use of it, invalidates the sessions,
          tokens and derived credentials created with it, and records the actual times against the targets.
        method: >-
          The owner runs the drill at least once per release cycle or after a procedure change, timing each step
          from the simulated detection, attaching the log review and the invalidation evidence, and the drill
          record is approved by the risk owner.
        negative_path: true
        evidence: [manual-verification, log-sample, approval-record]
        automation:
          kind: none
      - id: VCGF-SECR-002-AT04
        type: automated
        criterion: >-
          After an emergency revocation of a signing or session secret, every token signed with the revoked key is
          rejected once the documented grace period, if any, has elapsed, every session derived from it is
          terminated so its next request requires re-authentication, and refresh tokens issued under it cannot
          obtain new access tokens.
        method: >-
          An integration test issues tokens, sessions and refresh tokens, invokes the revocation procedure,
          advances the clock past the grace period and asserts the rejection of each derived credential.
        negative_path: true
        evidence: [test-result]
        automation:
          kind: ci
          reference: tests/secrets/test_derived_credential_invalidation (per project)
