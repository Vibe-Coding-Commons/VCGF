    load_point: route
    triggers:
      always: true
    rationale: Minimum task governance for every route (runtime/routing-policy.yaml minimum_controls).
  VCGF-AI-002:
    load_point: route
    triggers:
      capabilities: [adaptive-engineering, development-agent]
    rationale: Loaded through the capabilities that map to it.
