# Canonical applicability matrix: which task context makes a control applicable, and where it is loaded.
# Control Markdown stays the normative text; this file adds machine-readable applicability only.
# The Task Router uses it for the profile layer: a control required by the confirmed profile is added to a route
# when one of its trigger capabilities is selected for the task (or when always: true). Capability control_ids
# remain the profile-independent floor. scripts/validate-applicability.py enforces that every non-deprecated
# control is reachable for the high-assurance profile from at least one intent.
matrix_version: 1.0.0
load_points: [route]
controls:
