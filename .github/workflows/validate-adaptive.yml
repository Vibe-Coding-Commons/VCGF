name: Adaptive candidate quality
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adaptive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt
      - run: python -m coverage run --branch --source=runtime.adaptive -m pytest tests/adaptive -q --junitxml=quality-junit.xml
      - run: python -m coverage xml -o quality-coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: adaptive-${{ matrix.os }}-${{ matrix.python }}
          path: |
            quality-junit.xml
            quality-coverage.xml
          if-no-files-found: error
          retention-days: 14
  legacy-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r examples/integrations/requirements.txt
      - run: python scripts/release-quality-gate.py
      - run: python scripts/validate-runtime.py
      - run: python scripts/generate-runtime-registry.py --check
      - run: python scripts/generate-adapter-rules.py --check
      - run: python tests/contracts/test_phase1.py
      - run: python tests/scenarios/test_runtime.py
      - run: python tests/scenarios/test_gates.py
      - run: python tests/scenarios/test_adapters.py
      - run: python tests/scenarios/test_integrations.py
      - run: git diff --exit-code -- spec/control-catalog.yaml REPOSITORY-TREE.md FILE-MANIFEST.md
# A successful candidate workflow is NOT release approval. Real target-project,
# provider, host identity, and independent review evidence are separate gates.
