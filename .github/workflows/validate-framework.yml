name: Validate framework
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/validate-controls.py
      - run: python scripts/validate-profiles.py
      - run: python scripts/validate-cross-references.py
      - run: python scripts/validate-vendor-neutral-core.py
      - run: python scripts/validate-attribution.py
      - run: python scripts/validate-placeholders.py
      - run: python scripts/validate-license.py
      - run: python scripts/validate-version.py
      - run: python scripts/validate-documentation.py
      - run: python scripts/validate-repository-structure.py
      - run: python scripts/validate-package-integrity.py
