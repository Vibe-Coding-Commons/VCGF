name: Refresh VCGF v1.3.0 release candidate

on:
  push:
    branches:
      - release/v1.3.0

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v1.3.0
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Remove one-shot workflow before repository generation
        run: rm -f .github/workflows/v1.3-refresh-generated.yml

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt -r examples/integrations/requirements.txt

      - name: Regenerate derived repository artifacts
        run: |
          python scripts/generate-control-catalog.py
          python scripts/generate-repository-tree.py
          python scripts/generate-file-manifest.py
          python scripts/generate-runtime-registry.py

      - name: Validate release candidate
        run: |
          python scripts/release-quality-gate.py
          python -B scripts/validate-runtime.py
          python -B scripts/generate-runtime-registry.py --check
          python -B tests/contracts/test_phase1.py
          python -m pytest tests/adaptive -q
          python -m pytest tests/adaptive/test_smart_ui_pack.py -q
          python packs/ux/smart-ui/scripts/validate_final.py --verify-manifest

      - name: Commit refreshed candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): refresh v1.3 compatibility evidence and generated indexes"
          git push origin HEAD:release/v1.3.0
