name: Test suite

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt -r examples/integrations/requirements.txt
      - name: Full test suite (contracts, runtime, scenarios, adaptive, acceptance self-checks)
        run: python -m pytest tests -q --junitxml=tests-junit.xml
        env:
          PYTHONIOENCODING: utf-8
      - name: Self-acceptance results (framework as the system under test)
        run: python scripts/run-self-acceptance.py --check
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: tests-junit.xml
