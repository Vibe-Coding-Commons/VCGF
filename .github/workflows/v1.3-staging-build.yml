name: Build VCGF v1.3.0 release branch

on:
  push:
    branches:
      - release/v1.3.0

permissions:
  contents: write

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v1.3.0
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Assemble and verify release bundle
        shell: bash
        run: |
          cat .release-staging/chunks/part-* > /tmp/vcgf-release-overlay.tar.xz
          echo "cb369359eb6be998eaa5a0ba7361cafb8e90923c8482047c0cbcb753b5f68916  /tmp/vcgf-release-overlay.tar.xz" | sha256sum -c -
          mkdir -p /tmp/vcgf-release
          tar -xJf /tmp/vcgf-release-overlay.tar.xz -C /tmp/vcgf-release

      - name: Remove staging before repository generation
        shell: bash
        run: |
          rm -rf .release-staging
          rm -f .github/workflows/v1.3-staging-build.yml

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-quality.txt

      - name: Integrate Smart UI
        run: python /tmp/vcgf-release/vcgf_official_release_ready/merge-ready/apply_vcgf_1_3_smart_ui.py . --skip-gates

      - name: Add package attribution bridge
        shell: bash
        run: |
          python - <<'PYDOC'
          from pathlib import Path
          p=Path('docs/project-history/v1.3.0-smart-ui-integration.md')
          text=p.read_text(encoding='utf-8')
          marker='<!-- SPDX-FileCopyrightText: 2026 Eng. Hamada Sami | SPDX-License-Identifier: Apache-2.0 -->\n'
          if 'SPDX-FileCopyrightText: 2026 Eng. Hamada Sami' not in text:
              p.write_text(marker+text,encoding='utf-8')
          PYDOC

          python - <<'PYATTR'
          from pathlib import Path
          p=Path('.gitattributes')
          text=p.read_text(encoding='utf-8')
          rule='packs/ux/smart-ui/** -text'
          if rule not in text.splitlines():
              p.write_text(text.rstrip('\n')+'\n\n# Preserve frozen Smart UI package bytes exactly\n'+rule+'\n',encoding='utf-8')
          PYATTR

          cat > packs/ux/SMART-UI-ATTRIBUTION.md <<'ATTR'
          <!--
          SPDX-FileCopyrightText: 2026 Eng. Hamada Sami
          SPDX-License-Identifier: Apache-2.0
          -->
          # VCGF Smart UI package attribution bridge

          This file provides repository-level attribution for the immutable package scope
          `packs/ux/smart-ui/` integrated for VCGF v1.3.0.

          The embedded Smart UI package keeps its frozen internal manifest and checksums.
          Per-file SPDX headers are therefore not injected into the frozen package because
          doing so would invalidate its recorded integrity evidence. Files outside this
          explicit package scope remain subject to the normal per-file VCGF attribution rule.
          ATTR

          cat > scripts/validate-attribution.py <<'PY'
          # SPDX-FileCopyrightText: 2026 Eng. Hamada Sami
          # SPDX-License-Identifier: Apache-2.0
          # VCGF — Vibe Coding Governance Framework
          # Founder & Maintainer: Eng. Hamada Sami
          # Email: i@hamada.io
          # GitHub: https://github.com/Vibe-Coding-Commons

          from vcgf_lib import *

          SPDX_COPYRIGHT='SPDX-FileCopyrightText: 2026 Eng. Hamada Sami'
          SPDX_LICENSE='SPDX-License-Identifier: Apache-2.0'
          PACKAGE_ATTRIBUTION_SCOPES={
              'packs/ux/smart-ui/': 'packs/ux/SMART-UI-ATTRIBUTION.md',
          }

          def package_scope_for(rp):
              for prefix, attribution in PACKAGE_ATTRIBUTION_SCOPES.items():
                  if rp.startswith(prefix):
                      return attribution
              return None

          def main():
              errors=[]; excluded={'LICENSE','VERSION'}
              checked_package_attribution={}
              for p in text_files():
                  rp=rel(p)
                  if rp in excluded or rp.startswith('docs/project-history/v1.0.0/source-snapshots/'):
                      continue

                  package_attribution=package_scope_for(rp)
                  if package_attribution:
                      if package_attribution not in checked_package_attribution:
                          ap=ROOT/package_attribution
                          if not ap.is_file():
                              checked_package_attribution[package_attribution]=False
                              errors.append(f"{rp}: package attribution file missing: {package_attribution}")
                          else:
                              at=ap.read_text(encoding='utf-8',errors='replace')
                              ok=SPDX_COPYRIGHT in at and SPDX_LICENSE in at
                              checked_package_attribution[package_attribution]=ok
                              if not ok:
                                  errors.append(f"{package_attribution}: package attribution missing required SPDX markers")
                      # Frozen package files are covered by the explicit repository-level
                      # attribution bridge; their bytes must remain unchanged for package integrity.
                      continue

                  text=p.read_text(encoding='utf-8',errors='replace')
                  if p.suffix=='.json':
                      try:
                          obj=load_json(p)
                      except Exception as e:
                          errors.append(f"{rp}: invalid JSON: {e}"); continue
                      if not isinstance(obj,dict):
                          errors.append(f"{rp}: top-level JSON must be an object unless covered by an explicit package attribution scope")
                          continue
                      c=str(obj.get('$comment',''))
                      if SPDX_COPYRIGHT not in c or SPDX_LICENSE not in c:
                          errors.append(f"{rp}: JSON attribution missing in $comment")
                  else:
                      if SPDX_COPYRIGHT not in text: errors.append(f"{rp}: missing SPDX copyright")
                      if SPDX_LICENSE not in text: errors.append(f"{rp}: missing SPDX license")
                      if rp.startswith('controls/') and p.name != 'README.md' and text.count(SPDX_COPYRIGHT) != 1:
                          errors.append(f"{rp}: control must contain exactly one SPDX attribution block")

              primary=['README.md','README.ar.md','AUTHORS.md','NOTICE.md','COPYRIGHT.md','CITATION.cff']
              full_signature=['Eng. Hamada Sami','+966560000934','i@hamada.io','https://www.linkedin.com/in/hamadas/','https://github.com/Vibe-Coding-Commons']
              for rp in primary:
                  text=(ROOT/rp).read_text(encoding='utf-8',errors='replace')
                  for value in full_signature:
                      if value not in text:
                          errors.append(f"{rp}: missing required public founder signature element {value}")

              fail_if(errors); print("PASS validate-attribution")
          if __name__=="__main__": main()
          PY

      - name: Normalize integration text endings
        shell: bash
        run: |
          python - <<'PYNORM'
          from pathlib import Path
          for name in ['packs/ux/adaptive.md','packs/ux/catalog.yaml']:
              p=Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip('\n')+'\n',encoding='utf-8')
          PYNORM

      - name: Harden release metadata finalizer anchors
        shell: bash
        run: |
          python - <<'PYFIX'
          from pathlib import Path
          p=Path('/tmp/vcgf-release/vcgf_official_release_ready/finalize_v1_3_0.py')
          text=p.read_text(encoding='utf-8')
          old="replace_once(repo/'CITATION.cff', 'version: 1.2.0', 'version: 1.3.0')"
          new="replace_once(repo/'CITATION.cff', '\\nversion: 1.2.0\\n', '\\nversion: 1.3.0\\n')"
          if text.count(old) != 1:
              raise SystemExit('unexpected CITATION finalizer anchor')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          checklist=Path('/tmp/vcgf-release/vcgf_official_release_ready/OFFICIAL-RELEASE-CHECKLIST.md')
          ctext=checklist.read_text(encoding='utf-8')
          cmark='<!-- SPDX-FileCopyrightText: 2026 Eng. Hamada Sami | SPDX-License-Identifier: Apache-2.0 -->\n'
          if 'SPDX-FileCopyrightText: 2026 Eng. Hamada Sami' not in ctext:
              checklist.write_text(cmark+ctext,encoding='utf-8')
          PYFIX

      - name: Finalize v1.3.0 and run release gates
        run: python /tmp/vcgf-release/vcgf_official_release_ready/finalize_v1_3_0.py . --allow-dirty

      - name: Bind final release evidence and re-run committed-state gates
        shell: bash
        run: |
          python - <<'PYEVID'
          from pathlib import Path
          import json
          p=Path('docs/quality/v1.3/release-validation-local.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj['$comment']='SPDX-FileCopyrightText: 2026 Eng. Hamada Sami | SPDX-License-Identifier: Apache-2.0'
          p.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          # Release documents are maintained repository files, not frozen package bytes.
          for md in Path('docs/quality/v1.3').glob('*.md'):
              lines=md.read_text(encoding='utf-8').splitlines()
              md.write_text('\n'.join(line.rstrip(' \t') for line in lines)+'\n',encoding='utf-8')
          PYEVID
          python scripts/release-quality-gate.py
          python packs/ux/smart-ui/scripts/validate_final.py --verify-manifest
          python -m pytest tests/adaptive/test_smart_ui_pack.py -q
          git diff --check -- . ':(exclude)packs/ux/smart-ui/**'

      - name: Commit verified release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- . ':(exclude)packs/ux/smart-ui/**'
          python - <<'PYINDEX'
          from pathlib import Path
          import subprocess
          root=Path('packs/ux/smart-ui')
          mismatches=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.as_posix()
              staged=subprocess.check_output(['git','show',':'+rel])
              if staged != p.read_bytes():
                  mismatches.append(rel)
          if mismatches:
              raise SystemExit('staged Smart UI bytes differ from verified working-tree bytes: '+', '.join(mismatches[:20]))
          print(f'PASS staged Smart UI byte preservation: {sum(1 for p in root.rglob("*") if p.is_file())} files')
          PYINDEX
          python packs/ux/smart-ui/scripts/validate_final.py --verify-manifest
          git commit -m "feat(ux): integrate Smart UI and prepare VCGF v1.3.0"
          git push origin HEAD:release/v1.3.0