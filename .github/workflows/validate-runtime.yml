name: Validate opt-in runtime
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -r examples/integrations/requirements.txt
      - run: python -B scripts/validate-runtime.py
      - run: python -B scripts/generate-runtime-registry.py --check
      - run: python -B scripts/generate-adapter-rules.py --check
      - run: python -B tests/contracts/test_phase1.py
      - run: python -B tests/scenarios/test_runtime.py
      - run: python -B tests/scenarios/test_gates.py
      - run: python -B tests/scenarios/test_adapters.py
      - run: python -B tests/scenarios/test_integrations.py
