name: Release quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  release-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/release-quality-gate.py
      - name: Confirm generated release files are current
        run: git diff --exit-code -- spec/control-catalog.yaml REPOSITORY-TREE.md FILE-MANIFEST.md
