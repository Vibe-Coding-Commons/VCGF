#
# This workflow never creates or moves tags. It only drafts a GitHub release for
# a tag that already exists, is GPG-signed by an allowed maintainer key committed
# under .github/release-keys/, matches VERSION, and has every required check
# succeeded on the tagged commit. Publishing the draft remains a manual action
# after independent review; a green run here is not release approval.

name: Draft release for a signed tag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing signed release tag to draft (for example v1.3.1)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  draft-release:
    if: github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Import allowed signer keys
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/vcgf-release-gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          shopt -s nullglob
          keys=(.github/release-keys/*.asc)
          if [ "${#keys[@]}" -eq 0 ]; then
            echo "::error::No allowed signer keys found in .github/release-keys/*.asc. A release cannot be drafted until a maintainer commits an ASCII-armoured public key and an independent reviewer confirms its fingerprint (see .github/release-keys/README.md)."
            exit 1
          fi
          for key in "${keys[@]}"; do
            echo "Importing $key"
            gpg --batch --import "$key"
          done
          echo "Allowed signer fingerprints:"
          gpg --batch --list-keys --with-colons | awk -F: '$1=="fpr"{print $10}'
      - name: Verify signed tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a stable release tag of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch --tags origin || echo "::warning::Could not refetch tags without credentials; using the tags from the fetch-depth 0 checkout"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' does not exist. This workflow never creates tags; create it with 'git tag -s' and push it first."
            exit 1
          fi
          # Fails for unsigned tags and for signatures not made by an imported allowed key.
          git tag -v "$TAG"
          SHA="$(git rev-list -n1 "$TAG")"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "Tag $TAG resolves to commit $SHA"
          git checkout --detach "$SHA"
      - name: Install validation dependencies from the tagged tree
        run: pip install -r requirements-dev.txt
      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          test "v$(cat VERSION)" = "$TAG" || { echo "::error::VERSION file ($(cat VERSION)) does not match tag $TAG"; exit 1; }
      - name: Verify required checks succeeded on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" > check-runs.json
          python - <<'PY'
          import json, os
          data = json.load(open('check-runs.json', encoding='utf-8'))
          self_marker = f"/runs/{os.environ.get('GITHUB_RUN_ID', '')}/"
          runs = [r for r in data.get('check_runs', []) if self_marker not in (r.get('html_url') or '') and self_marker not in (r.get('details_url') or '')]
          failures = [f"{r.get('name')}: status={r.get('status')} conclusion={r.get('conclusion')}" for r in runs if r.get('status') != 'completed' or r.get('conclusion') != 'success']
          print(f"check runs on tagged commit (excluding this run): {len(runs)} of total_count={data.get('total_count')}")
          for r in runs:
              print(f"  - {r.get('name')}: {r.get('status')}/{r.get('conclusion')}")
          if len(runs) < 7:
              raise SystemExit(f"::error::Only {len(runs)} check runs found on the tagged commit; at least 7 successful required checks are expected")
          if failures:
              raise SystemExit("::error::Not every check on the tagged commit succeeded:\n" + "\n".join(failures))
          print("PASS required checks")
          PY
      - name: Run read-only gate
        run: |
          set -euo pipefail
          grep -Eq '^release_status: (stable|release-candidate)$' VCGF-MANIFEST.yaml || { echo '::error::release_status must be stable or release-candidate; a development tree is never drafted as a release'; exit 1; }
          python scripts/release-quality-gate.py
          python scripts/validate-package-integrity.py
          git diff --exit-code -- spec/control-catalog.yaml REPOSITORY-TREE.md FILE-MANIFEST.md
      - name: Build assets
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="VCGF-$TAG/" -o "VCGF-$TAG.tar.gz" "$TAG"
          git archive --format=zip --prefix="VCGF-$TAG/" -o "VCGF-$TAG.zip" "$TAG"
          python scripts/generate-sbom.py --output sbom.cdx.json
          sha256sum "VCGF-$TAG.tar.gz" "VCGF-$TAG.zip" sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create DRAFT release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="docs/quality/v$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')/release-notes-$TAG.md"
          test -f "$NOTES" || { echo "::error::Release notes file $NOTES not found in the tagged tree"; exit 1; }
          gh release create "$TAG" --draft --verify-tag --title "VCGF $TAG" --notes-file "$NOTES" \
            "VCGF-$TAG.tar.gz" "VCGF-$TAG.zip" sbom.cdx.json SHA256SUMS.txt
          echo "Draft release created for $TAG. Publishing it is a separate manual action after independent review."

  link-arabic-translation:
    # One-time requested GitHub Release description update. Remove this job after success.
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Link published English release to Arabic translation and correct release status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, pathlib, subprocess, tempfile
          repo=os.environ['GITHUB_REPOSITORY']
          ar_url='https://github.com/Vibe-Coding-Commons/VCGF/blob/main/docs/quality/v1.4/release-notes-v1.4.0.ar.md'
          result=subprocess.check_output(['gh','release','view','v1.4.0','--repo',repo,'--json','body,isDraft,isPrerelease'],text=True)
          release=json.loads(result)
          if release['isDraft'] or release['isPrerelease']:
              raise SystemExit('Refusing to rewrite a draft or pre-release')
          original=release['body']
          if '# VCGF 1.4.0' not in original or 'SPDX-FileCopyrightText: 2026 Eng. Hamada Sami' not in original:
              raise SystemExit('Release body changed unexpectedly')
          updated=original
          language='**Language / اللغة:** **English (this page)** | [العربية — ملاحظات إصدار VCGF v1.4.0]('+ar_url+')'
          if language not in updated:
              marker='-->\n\n'
              if marker not in updated: raise SystemExit('Missing attribution marker')
              updated=updated.replace(marker,marker+language+'\n\n',1)
          updated=updated.replace('[Arabic release notes](release-notes-v1.4.0.ar.md)','[Arabic release notes]('+ar_url+')')
          newstatus='**Release status (27 October 2026):** VCGF v1.4.0 is officially published as a public, non-draft, non-prerelease GitHub Release. Its signed tag points to commit '+chr(96)+'377e3eb382f7c89fea4a036c297ace83599bd316'+chr(96)+'. The tagged source manifest retains the pre-publication '+chr(96)+'release-candidate'+chr(96)+' metadata; this does not change GitHub publication status or retroactively alter the signed tag.'
          updated,count=re.subn(r'^\*\*Source status \(2026-10-26\):\*\*.*$',lambda m:newstatus,updated,count=1,flags=re.MULTILINE)
          if count!=1 and '**Release status (27 October 2026):**' not in updated: raise SystemExit('Expected status line absent')
          updated=updated.replace('Now (1.4.0 development)','Now (1.4.0 published source)')
          updated=updated.replace('Not a release decision, not a conformance claim for any project or platform, and not a substitute for the independent review required before publication.','Publication of this release is not a conformance claim for any project or platform and does not replace project-specific independent review.')
          if ar_url not in updated or 'English (this page)' not in updated or 'officially published' not in updated: raise SystemExit('Incomplete links')
          if updated != original:
              with tempfile.NamedTemporaryFile(mode='w',encoding='utf-8',suffix='.md',delete=False) as fp:
                  fp.write(updated)
                  filename=fp.name
              subprocess.run(['gh','release','edit','v1.4.0','--repo',repo,'--notes-file',filename],check=True)
              pathlib.Path(filename).unlink(missing_ok=True)
              print('Updated published GitHub Release with Arabic link and accurate status')
          else:
              print('Bilingual release navigation already current')
          PY
